name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
        env:
          OPENROUTER_API_KEY: ''
          AI_ENABLED: 'false'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          OPENROUTER_API_KEY: ''
          AI_ENABLED: 'false'
