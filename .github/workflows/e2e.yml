name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/components/**'
      - 'src/stores/**'
      - 'src/test/e2e/**'
      - 'playwright.config.ts'

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e
        env:
          AI_ENABLED: 'false'
          OPENROUTER_API_KEY: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
