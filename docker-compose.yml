services:
  web:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/moon-courier.db
      DB_AUTO_MIGRATE: "true"
      DEMO_AUTO_SEED: "true"
    volumes:
      - moon_courier_data:/app/data
      - moon_courier_reports:/app/reports
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  moon_courier_data:
  moon_courier_reports:
